name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-cpp:
    name: Analyze C++
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Configure
        run: cmake --preset windows-x64-release -B build/codeql
      - name: Build
        run: cmake --build build/codeql --config Release
      - name: Analyze
        uses: github/codeql-action/analyze@v4
