name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-coverage:
    name: Collect coverage
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure coverage build
        run: cmake --preset windows-x64-debug -B build/coverage
      - name: Build coverage tests
        run: >-
          cmake --build build/coverage --config Debug
          --target TempoFlowPresetValidatorTests TempoFlowHostTimingTests TempoFlowClickEngineTests
          TempoFlowPresetRuntimeModelTests TempoFlowPluginTests
      - name: Collect native C++ coverage
        shell: pwsh
        env:
          DOTNET_COVERAGE_NOLOGO: "1"
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: "1"
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found.'
          }

          $installationPath = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'A Visual Studio installation with the MSVC x64 tools was not found.'
          }

          $coverageTool = Join-Path $installationPath `
            'Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe'
          $presetTestExecutable = (Resolve-Path `
            'build\coverage\TempoFlowPresetValidatorTests_artefacts\Debug\TempoFlowPresetValidatorTests.exe').Path
          $timingTestExecutable = (Resolve-Path `
            'build\coverage\Debug\TempoFlowHostTimingTests.exe').Path
          $clickTestExecutable = (Resolve-Path `
            'build\coverage\Debug\TempoFlowClickEngineTests.exe').Path
          $runtimeModelTestExecutable = (Resolve-Path `
            'build\coverage\Debug\TempoFlowPresetRuntimeModelTests.exe').Path
          $pluginTestExecutable = (Resolve-Path `
            'build\coverage\TempoFlowPluginTests_artefacts\Debug\TempoFlowPluginTests.exe').Path
          $dynamicCoverageSettings = (Resolve-Path `
            'cmake\microsoft-code-coverage-dynamic.config').Path
          $presetCoverage = Join-Path $PWD 'build\coverage\preset-tests.coverage'
          $timingCoverage = Join-Path $PWD 'build\coverage\timing-tests.coverage'
          $clickCoverage = Join-Path $PWD 'build\coverage\click-tests.coverage'
          $runtimeModelCoverage = Join-Path $PWD 'build\coverage\runtime-model-tests.coverage'
          $pluginCoverage = Join-Path $PWD 'build\coverage\plugin-tests.coverage'
          $coverageReport = Join-Path $PWD 'build\coverage\coverage.cobertura.xml'

          if (-not (Test-Path -LiteralPath $coverageTool -PathType Leaf)) {
            throw 'Microsoft.CodeCoverage.Console.exe was not found.'
          }

          function Invoke-CoverageCollection {
            param(
              [Parameter(Mandatory)] [string] $Executable,
              [Parameter(Mandatory)] [string] $Output,
              [string] $Settings
            )

            $arguments = @(
              'collect'
              '--include-files', $Executable
              '--output', $Output
              '--output-format', 'coverage'
              '--nologo'
            )
            if (-not [string]::IsNullOrWhiteSpace($Settings)) {
              $arguments += @('--settings', $Settings)
            }

            & $coverageTool @arguments $Executable
            if ($LASTEXITCODE -ne 0) {
              throw "Coverage collection failed for $Executable with exit code $LASTEXITCODE."
            }
          }

          Invoke-CoverageCollection -Executable $presetTestExecutable -Output $presetCoverage
          Invoke-CoverageCollection -Executable $timingTestExecutable -Output $timingCoverage
          Invoke-CoverageCollection -Executable $clickTestExecutable -Output $clickCoverage
          Invoke-CoverageCollection -Executable $runtimeModelTestExecutable -Output $runtimeModelCoverage
          Invoke-CoverageCollection `
            -Executable $pluginTestExecutable `
            -Output $pluginCoverage `
            -Settings $dynamicCoverageSettings

          & $coverageTool merge `
            $presetCoverage `
            $timingCoverage `
            $clickCoverage `
            $runtimeModelCoverage `
            $pluginCoverage `
            --output $coverageReport `
            --output-format cobertura `
            --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Coverage merge failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $coverageReport -PathType Leaf)) {
            throw 'Coverage collection did not create the expected Cobertura report.'
          }

          [xml] $coverageXml = Get-Content -LiteralPath $coverageReport -Raw
          $requiredSources = @(
            '[\\/]src[\\/]preset[\\/]PresetValidator\.(cpp|h)$',
            '[\\/]src[\\/]timing[\\/]BeatScheduler\.(cpp|h)$',
            '[\\/]src[\\/]audio[\\/]ClickEngine\.(cpp|h)$',
            '[\\/]src[\\/]preset[\\/]PresetRuntimeModel\.(cpp|h)$',
            '[\\/]src[\\/]plugin[\\/]PluginPresetState\.(cpp|h)$',
            '[\\/]src[\\/]plugin[\\/]PluginProcessor\.(cpp|h)$'
          )
          if ([int]$coverageXml.coverage.'lines-valid' -le 0) {
            throw 'The Cobertura report contains no TempoFlow source coverage.'
          }

          foreach ($requiredSource in $requiredSources) {
            $projectSources = @(
              $coverageXml.coverage.packages.package.classes.class |
                Where-Object { $_.filename -match $requiredSource }
            )
            $coveredProjectLines = @(
              $projectSources.lines.line |
                Where-Object { [int]$_.hits -gt 0 }
            )
            if ($projectSources.Count -eq 0 -or $coveredProjectLines.Count -eq 0) {
              throw "The Cobertura report has no covered source matching $requiredSource."
            }
          }

          $repositoryRoot = (Resolve-Path -LiteralPath '.').Path.TrimEnd('\', '/') + '\'
          $coverageClasses = @($coverageXml.coverage.packages.package.classes.class)
          foreach ($coverageClass in $coverageClasses) {
            $sourcePath = [string]$coverageClass.filename
            if (-not $sourcePath.StartsWith(
              $repositoryRoot,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Coverage source is outside the repository: $sourcePath"
            }

            $relativePath = $sourcePath.Substring($repositoryRoot.Length).Replace('\', '/')
            $coverageClass.SetAttribute('filename', $relativePath)
          }

          $coverageXml.Save($coverageReport)

          [xml] $normalizedCoverageXml = Get-Content -LiteralPath $coverageReport -Raw
          $normalizedSourcePaths = @(
            $normalizedCoverageXml.coverage.packages.package.classes.class |
              ForEach-Object { [string]$_.filename }
          )
          $invalidSourcePaths = @(
            $normalizedSourcePaths |
              Where-Object {
                [System.IO.Path]::IsPathRooted($_) -or
                $_ -match '(^|/)\.\.(/|$)' -or
                $_ -match '\\'
              }
          )
          if ($invalidSourcePaths.Count -gt 0) {
            throw 'The Cobertura report contains non-portable source paths after normalization.'
          }

          $requiredNormalizedSources = @(
            '^src/preset/PresetValidator\.(cpp|h)$',
            '^src/timing/BeatScheduler\.(cpp|h)$',
            '^src/audio/ClickEngine\.(cpp|h)$',
            '^src/preset/PresetRuntimeModel\.(cpp|h)$',
            '^src/plugin/PluginPresetState\.(cpp|h)$',
            '^src/plugin/PluginProcessor\.(cpp|h)$'
          )
          foreach ($requiredSource in $requiredNormalizedSources) {
            if (@($normalizedSourcePaths | Where-Object { $_ -match $requiredSource }).Count -eq 0) {
              throw "The normalized Cobertura report has no source matching $requiredSource."
            }
          }
      - name: Store coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msvc-coverage
          path: build/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 1

  upload-coverage:
    name: Upload coverage
    needs: collect-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msvc-coverage
          path: build/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: build/coverage/coverage.cobertura.xml
          flags: unit-tests
          name: windows-msvc
          use_oidc: true
          version: v11.3.1
