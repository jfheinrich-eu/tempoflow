name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-coverage:
    name: Collect coverage
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure coverage build
        run: cmake --preset windows-x64-debug -B build/coverage
      - name: Build coverage tests
        run: cmake --build build/coverage --config Debug --target TempoFlowPresetValidatorTests
      - name: Collect native C++ coverage
        shell: pwsh
        env:
          DOTNET_COVERAGE_NOLOGO: "1"
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: "1"
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found.'
          }

          $installationPath = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'A Visual Studio installation with the MSVC x64 tools was not found.'
          }

          $coverageTool = Join-Path $installationPath `
            'Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe'
          $testExecutable = (Resolve-Path `
            'build\coverage\TempoFlowPresetValidatorTests_artefacts\Debug\TempoFlowPresetValidatorTests.exe').Path
          $coverageReport = Join-Path $PWD 'build\coverage\coverage.cobertura.xml'

          if (-not (Test-Path -LiteralPath $coverageTool -PathType Leaf)) {
            throw 'Microsoft.CodeCoverage.Console.exe was not found.'
          }

          & $coverageTool collect `
            --include-files $testExecutable `
            --output $coverageReport `
            --output-format cobertura `
            --nologo `
            $testExecutable
          if ($LASTEXITCODE -ne 0) {
            throw "Coverage collection failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $coverageReport -PathType Leaf)) {
            throw 'Coverage collection did not create the expected Cobertura report.'
          }

          [xml] $coverageXml = Get-Content -LiteralPath $coverageReport -Raw
          $projectSources = @(
            $coverageXml.coverage.packages.package.classes.class |
              Where-Object { $_.filename -match '[\\/]src[\\/]preset[\\/]PresetValidator\.(cpp|h)$' }
          )
          $coveredProjectLines = @(
            $projectSources.lines.line |
              Where-Object { [int]$_.hits -gt 0 }
          )
          if (
            [int]$coverageXml.coverage.'lines-valid' -le 0 -or
            $projectSources.Count -eq 0 -or
            $coveredProjectLines.Count -eq 0
          ) {
            throw 'The Cobertura report contains no TempoFlow source coverage.'
          }

          $repositoryRoot = (Resolve-Path -LiteralPath '.').Path.TrimEnd('\', '/') + '\'
          $coverageClasses = @($coverageXml.coverage.packages.package.classes.class)
          foreach ($coverageClass in $coverageClasses) {
            $sourcePath = [string]$coverageClass.filename
            if (-not $sourcePath.StartsWith(
              $repositoryRoot,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Coverage source is outside the repository: $sourcePath"
            }

            $relativePath = $sourcePath.Substring($repositoryRoot.Length).Replace('\', '/')
            $coverageClass.SetAttribute('filename', $relativePath)
          }

          $coverageXml.Save($coverageReport)

          [xml] $normalizedCoverageXml = Get-Content -LiteralPath $coverageReport -Raw
          $normalizedSourcePaths = @(
            $normalizedCoverageXml.coverage.packages.package.classes.class |
              ForEach-Object { [string]$_.filename }
          )
          $invalidSourcePaths = @(
            $normalizedSourcePaths |
              Where-Object {
                [System.IO.Path]::IsPathRooted($_) -or
                $_ -match '(^|/)\.\.(/|$)' -or
                $_ -match '\\'
              }
          )
          if ($invalidSourcePaths.Count -gt 0) {
            throw 'The Cobertura report contains non-portable source paths after normalization.'
          }

          $normalizedProjectSources = @(
            $normalizedSourcePaths |
              Where-Object { $_ -match '^src/preset/PresetValidator\.(cpp|h)$' }
          )
          if ($normalizedProjectSources.Count -eq 0) {
            throw 'The normalized Cobertura report contains no TempoFlow source paths.'
          }
      - name: Store coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msvc-coverage
          path: build/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 1

  upload-coverage:
    name: Upload coverage
    needs: collect-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msvc-coverage
          path: build/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: build/coverage/coverage.cobertura.xml
          flags: unit-tests
          name: windows-msvc
          use_oidc: true
          version: v11.3.1
