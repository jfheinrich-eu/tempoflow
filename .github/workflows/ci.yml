name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify repository formatting
        shell: pwsh
        run: .\scripts\verify-format.ps1
      - name: Configure
        run: cmake --preset windows-x64-release -B build/ci
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Run toolchain check
        run: .\build\ci\TempoFlowToolchainCheck_artefacts\Release\TempoFlowToolchainCheck.exe
      - name: Download NSIS 3.13
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'nsis-3.13'
          curl.exe --fail --location --output $archive 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS download failed with exit code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          if ($actualHash -ne $expectedHash) {
            throw "NSIS archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Join-Path $destination 'nsis-3.13\makensis.exe'
          "TEMPOFLOW_NSIS_EXECUTABLE=$executable" >> $env:GITHUB_ENV
      - name: Build and verify Windows installer
        shell: pwsh
        run: .\scripts\build-windows-installer.ps1 -BuildDirectory build/ci
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TempoFlow-windows-x64-installer
          path: |
            build/ci/package/TempoFlow-*-windows-x64.exe
            build/ci/package/TempoFlow-*-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

  macos-universal-build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake --preset macos-universal-release
      - name: Build
        run: cmake --build --preset macos-universal-release
      - name: Test
        run: ctest --preset macos-universal-release
      - name: Run toolchain check
        shell: bash
        run: |
          toolchain_check=$(find \
            build/macos-universal-release/TempoFlowToolchainCheck_artefacts/Release \
            -type f -perm -111 -print -quit)
          if [[ -z "$toolchain_check" ]]; then
            echo "TempoFlow toolchain check executable was not found." >&2
            exit 1
          fi
          "$toolchain_check"
      - name: Verify universal Mach-O binaries
        shell: bash
        run: |
          plugin_binary="build/macos-universal-release/TempoFlowPlugin_artefacts/Release/VST3/TempoFlow.vst3/Contents/MacOS/TempoFlow"
          if [[ ! -f "$plugin_binary" ]]; then
            echo "TempoFlow VST3 executable was not found: $plugin_binary" >&2
            exit 1
          fi

          verified=0
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              lipo "$binary" -verify_arch arm64 x86_64
              echo "$binary: $(lipo "$binary" -archs)"
              verified=$((verified + 1))
            fi
          done < <(find build/macos-universal-release \
            -path '*_artefacts/Release/*' -type f -perm -111 -print0)

          if [[ $verified -eq 0 ]]; then
            echo "No project Mach-O executables were found for architecture verification." >&2
            exit 1
          fi
