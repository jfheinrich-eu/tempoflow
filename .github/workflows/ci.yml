name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check C++ formatting
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src, tests, tools -Recurse -File -Include *.cpp, *.h |
              ForEach-Object FullName
          )
          clang-format --dry-run --Werror --style=file @files
      - name: Configure
        run: cmake --preset windows-x64-release -B build/ci
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Run toolchain check
        run: .\build\ci\TempoFlowToolchainCheck_artefacts\Release\TempoFlowToolchainCheck.exe
